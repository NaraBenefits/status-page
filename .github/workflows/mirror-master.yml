# Not an Upptime-generated workflow — `update-template` only rewrites its own
# eight files, so this one survives regeneration.
#
# @upptime/status-page hardcodes the `master` ref when the browser fetches
# history/summary.json and the response-time graphs
# (src/components/LiveStatus.svelte), and neither `apiBaseUrl` nor
# `userContentBaseUrl` can redirect it. This repository's default branch is
# `main`, so without a `master` ref the live status list on the published site
# is permanently empty. This keeps `master` fast-forwarded to `main`.
#
# The schedule is what actually does the work: Upptime's own commits carry
# `[skip ci]`, which suppresses the push trigger below. Renaming the default
# branch to `master` would make this whole file unnecessary.

name: Mirror master
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-mirror-master
  cancel-in-progress: false
jobs:
  mirror:
    name: Fast-forward master to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Fast-forward master
        run: git push origin HEAD:refs/heads/master
